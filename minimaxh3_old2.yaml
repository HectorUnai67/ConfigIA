version: 1
extensions:
  - module: provisioner_comfyui
    config:
      workflows:
        - https://raw.githubusercontent.com/HectorUnai67/ConfigIA/refs/heads/main/MimiMaxH3_interpolated_OK_pruned.json

downloads:
  - url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/refs/heads/main/input/cactus_man.png
    dest: ${WORKSPACE}/ComfyUI/input/cactus_man.png
  - url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/refs/heads/main/input/high_view_classic_car.png
    dest: ${WORKSPACE}/ComfyUI/input/high_view_classic_car.png
  - url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/refs/heads/main/input/low_view_classic_car.png
    dest: ${WORKSPACE}/ComfyUI/input/low_view_classic_car.png
  - url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/refs/heads/main/input/egyptian_queen.png
    dest: ${WORKSPACE}/ComfyUI/input/egyptian_queen.png
  - url: https://raw.githubusercontent.com/Comfy-Org/workflow_templates/refs/heads/main/input/ltx_23_audio.mp3
    dest: ${WORKSPACE}/ComfyUI/input/ltx_23_audio.mp3

    # Descarga existente de HuggingFace
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors  # 21 GB
    dest: ${WORKSPACE}/ComfyUI/models/diffusion_models/minimax_h3_fl2va_int8_convrot.safetensors
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors  # 21 GB
    dest: ${WORKSPACE}/ComfyUI/models/diffusion_models/minimax_h3_ref2va_int8_convrot.safetensors
  - url: https://huggingface.co/ethanfel/Qwen3-VL-32B-Ultra-Heretic-H3-ComfyUI-INT8-ConvRot/resolve/main/qwen3vl_32b_h3_ultra_uncensored_heretic_int8_convrot.safetensors  # 26.4 GB
    dest: ${WORKSPACE}/ComfyUI/models/text_encoders/qwen3vl_32b_h3_ultra_uncensored_heretic_int8_convrot.safetensors
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors  # 605 MB
    dest: ${WORKSPACE}/ComfyUI/models/vae/minimax_h3_audio_vae_fp32.safetensors
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors  # 5.21 GB
    dest: ${WORKSPACE}/ComfyUI/models/vae/minimax_h3_video_vae_fp16.safetensors  
  - url: https://huggingface.co/Kijai/MiniMax-H3-TAE/resolve/main/vae_approx/taeh3.safetensors # 9.34 MB
    dest: ${WORKSPACE}/ComfyUI/models/vae_approx/taeh3.safetensors
  - url: https://huggingface.co/larryvrh/MiniMax-H3-Turbo-Lora/resolve/main/minimax_h3_turbo_v4_step600_ema.safetensors  # 743.72 MB
    dest: ${WORKSPACE}/ComfyUI/models/loras/minimax_h3_turbo_v4_step600_ema.safetensors
  - url: https://huggingface.co/Kijai/MiniMax-H3-experimental/resolve/main/minimax_h3_video_vae_int8_convrot.safetensors  # 2.95 GB
    dest: ${WORKSPACE}/ComfyUI/models/vae/minimax_h3_video_vae_int8_convrot.safetensors
